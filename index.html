// EB1A readiness scoring — JS port of app/engine.py (keep the two in sync).
// Deterministic and evidence-driven: have=1.0, partial=0.5, missing=0.
const FACTORS = { have: 1.0, partial: 0.5, missing: 0.0 };

function scoreItems(items) {
  const total = items.reduce((a, i) => a + i.weight, 0);
  if (!total) return 0;
  const earned = items.reduce((a, i) => a + i.weight * FACTORS[i.status], 0);
  return Math.round(100 * earned / total);
}

function band(score) {
  if (score >= 75) return "Solid";
  if (score >= 50) return "Building";
  if (score >= 30) return "At risk";
  return "Weak";
}

function computeState(seed, overrides) {
  overrides = overrides || {};
  const evOver = overrides.evidence || {};
  const hyOver = overrides.hygiene || {};
  const taskOver = overrides.tasks || {};

  const criteria = seed.criteria.map(c => {
    const items = c.evidence.map((item, idx) => ({
      ...item, status: evOver[c.id + ":" + idx] || item.status
    }));
    const score = scoreItems(items);
    return { id: c.id, name: c.name, plain: c.plain, targeted: c.targeted,
             officer_note: c.officer_note, next_step: c.next_step,
             evidence: items, score, band: band(score) };
  });

  const targeted = criteria.filter(c => c.targeted);
  const merits = criteria.find(c => c.id === "final_merits");
  const hygieneItems = seed.hygiene.items.map((item, idx) => ({
    ...item, status: hyOver[String(idx)] || item.status
  }));
  const hygieneScore = scoreItems(hygieneItems);
  const criteriaAvg = Math.round(targeted.reduce((a, c) => a + c.score, 0) / targeted.length);
  const overall = Math.round(0.5 * criteriaAvg + 0.3 * merits.score + 0.2 * hygieneScore);
  const solidCount = targeted.filter(c => c.band === "Solid").length;
  const needed = seed.case.criteria_needed;
  const gateMet = solidCount >= needed && merits.score >= 60;

  let verdict;
  if (gateMet) {
    verdict = "Filing-ready by the numbers: at least three criteria are solid and the career story holds together. Attorney review is the next step.";
  } else if (solidCount >= needed) {
    verdict = "Three criteria are solid, but the final-merits story (sustained acclaim over the whole career) is not there yet.";
  } else {
    const open = targeted.filter(c => c.band !== "Solid");
    const closest = open.reduce((a, c) => c.score > a.score ? c : a);
    const weakest = open.reduce((a, c) => c.score < a.score ? c : a);
    verdict = "Not ready to file yet \u2014 " + solidCount + " of the " + needed +
      " required criteria are solid. The fastest route to one more is " +
      closest.name.toLowerCase() + " (" + closest.score + "%); the biggest gap is " +
      weakest.name.toLowerCase() + " (" + weakest.score + "%).";
  }

  const tasks = seed.tasks.map(t => ({ ...t, status: taskOver[t.id] || t.status }));
  return { case: seed.case, criteria, criteria_avg: criteriaAvg,
           hygiene: { name: seed.hygiene.name, items: hygieneItems, score: hygieneScore, band: band(hygieneScore) },
           overall, solid_count: solidCount, criteria_needed: needed,
           gate_met: gateMet, verdict, tasks,
           deadlines: seed.deadlines, papers_existing: seed.papers_existing,
           papers_pipeline: seed.papers_pipeline, connections: seed.connections,
           officer_brief: seed.officer_brief, benchmarks: seed.benchmarks || null };
}

ch: benchmarks file in the EB1A folder.", "figures": [{"value": "66.9%", "label": "EB-1A approval rate", "period": "FY2025 \u00b7 from USCIS I-140 counts"}, {"value": "40.7%", "label": "EB-1A approval rate", "period": "FY2026 Q1\u2013Q3 \u00b7 falling every quarter"}, {"value": "32.2%", "label": "Latest quarter's approval rate", "period": "FY2026 Q3 (Apr\u2013Jun 2026)"}, {"value": "~50%", "label": "Petitions drawing an RFE (estimate)", "period": "Practitioner/platform estimates \u00b7 USCIS publishes no RFE rate"}, {"value": "~60%", "label": "Approved after answering an RFE", "period": "Firm-reported \u00b7 no official figure exists"}, {"value": "32.5 mo", "label": "Regular processing: 80% of cases finish within", "period": "USCIS tool, Oct 2026 \u00b7 premium instead: 15 business days, $2,965"}], "figures_note": "For contrast: employer-sponsored EB-1B and EB-1C still approve at about 94\u201397%. EB-1A \u2014 the self-petitioned category, ours \u2014 accounts for roughly 93% of all EB-1 denials. The scrutiny is aimed at exactly this category.", "patterns": [{"pattern": "Step-2 final-merits failure", "status_label": "In our file", "status_class": "missing", "note": "The #1 loss point in 2026 \u2014 USCIS denied one recent case after conceding 5 of 10 criteria. Meeting criteria is the threshold, not the finish line. Our final merits sits at 14% today."}, {"pattern": "Acclaim clustered in a short window", "status_label": "In our file", "status_class": "missing", "note": "Almost all of our recognition is from 2025\u201326. The 2015\u20132024 evidence sweep on your task list is the direct fix."}, {"pattern": "Generic or insider support letters", "status_label": "In our file", "status_class": "missing", "note": "Our letter drafts lean on colleagues and repeat some passages. Independent writers, specifics, and de-duplication are still pending."}, {"pattern": "Contributions with no outside footprint", "status_label": "In our file", "status_class": "missing", "note": "Original Contributions is the most-RFE'd criterion in current practice. Ours has no documented outside adoption or citations yet."}, {"pattern": "Self-generated, unverifiable evidence", "status_label": "In our file", "status_class": "missing", "note": "Much of the contributions file today is our own filings and internal documents. Officers weight independent, third-party proof far higher."}, {"pattern": "Pay-to-publish publications", "status_label": "Handled", "status_class": "have", "note": "Present only in the old paper set, which the refiling excludes. The new papers target indexed venues only (see Publications)."}, {"pattern": "Paid memberships", "status_label": "Handled", "status_class": "have", "note": "Dropped from the filing slate on Oct 5. Remaining step: confirm they're removed from every copy of the resume and exhibits."}, {"pattern": "Judging without proof it happened", "status_label": "Handled", "status_class": "have", "note": "We hold completion records \u2014 full review texts and certificates \u2014 exactly what officers ask for."}, {"pattern": "Critical role resting on title alone", "status_label": "Handled", "status_class": "have", "note": "Backed by performance reviews, org chart, and a demonstrably distinguished employer \u2014 and USCIS already accepted this criterion once."}, {"pattern": "Volume instead of quality", "status_label": "Partly", "status_class": "partial", "note": "Bites at packaging time: every exhibit must tie to a criterion and its significance. The attorney-package phase enforces this."}, {"pattern": "Thin filing denied without an RFE", "status_label": "Partly", "status_class": "partial", "note": "Since Aug 5, 2026 (policy PA-2026-05) officers may deny outright when initial evidence is missing. Our filing gate exists for exactly this: nothing files until it is complete."}, {"pattern": "Published material that isn't real coverage", "status_label": "Not claimed", "status_class": "na", "note": "Not in our slate (backup only), so this pattern can't hurt the filing."}], "posture": "Cases in our current posture \u2014 two solid criteria and a third still thin \u2014 are exactly the filings the 2026 numbers are punishing. The data backs our plan: don't file yet. Corroborate Original Contributions with independent proof and finish one indexed publication, so we file with four criteria instead of a hopeful three.", "limits": "What the data cannot tell us: USCIS publishes no approval rates by number of criteria, by criterion, or by evidence profile \u2014 so no honest 'probability for our exact case' exists. The percentage on this page is our evidence readiness; these benchmarks are the climate it will be judged in."}};
const LS_KEY = "eb1a-state-v1";
let overrides = {evidence:{}, tasks:{}, hygiene:{}};
try { overrides = {...overrides, ...JSON.parse(localStorage.getItem(LS_KEY) || "{}")}; } catch(e) {}

const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const barClass = (s) => s >= 75 ? 'good' : s >= 50 ? '' : s >= 30 ? 'mid' : 'bad';
const chipClass = (b) => b.toLowerCase().replace(' ', '');

function save(){ localStorage.setItem(LS_KEY, JSON.stringify(overrides)); }
function load(){ render(computeState(SEED, overrides)); }

function evRow(critId, item, idx){
  const label = {have:'In file', partial:'Partly there', missing:'Missing'}[item.status];
  return `<div class="ev"><div class="ev-main">${esc(item.label)}<div class="src">${esc(item.source)}</div></div>
    <button class="pill ${item.status}" data-ev="${critId}:${idx}">${label}</button></div>`;
}

function render(d){
  const app = document.getElementById('app');
  const days = (ds) => Math.ceil((new Date(ds+'T12:00:00') - new Date()) / 864e5);
  app.innerHTML = '';

  app.append($(`<div>
    <h1>EB1A Case Dashboard</h1>
    <p class="sub">${esc(d.case.beneficiary)} · ${esc(d.case.field)}<br>${esc(d.case.petition)}</p>
  </div>`));

  const hero = $(`<section class="tile sec">
    <div class="hero">
      <div><div class="bignum">${d.overall}<small>%</small></div>
      <p class="sub" style="margin-top:6px">overall readiness</p></div>
      <div style="flex:1; min-width:260px">
        <h2>${d.gate_met ? 'Filing-ready by the numbers' : 'Not ready to file — yet'}</h2>
        <p class="sub" style="margin-top:6px">${esc(d.verdict)}</p>
        <p style="margin-top:12px; font-size:14px"><b>${d.solid_count} of ${d.criteria_needed} required criteria are solid.</b>
        <span class="sub">USCIS needs at least ${d.criteria_needed} criteria met, plus a final-merits pass. This score is computed from the evidence checklist below — when a document lands, tap its tag and the number moves.</span></p>
        <div class="bar ${barClass(d.overall)}"><div style="width:${d.overall}%"></div></div>
        <p class="sub" style="margin-top:8px">How it's built: half from the four targeted criteria, 30% from final merits, 20% from case paperwork (currently ${d.hygiene.score}%). Your taps are saved on this device; Buddy's syncs refresh the underlying case data.</p>
      </div>
    </div>
  </section>`);
  app.append(hero);

  const dl = $(`<section class="tile sec"><h2>Deadlines that matter</h2><div class="dl"></div></section>`);
  const dlBox = dl.querySelector('.dl');
  d.deadlines.forEach(x => {
    const n = days(x.date);
    dlBox.append($(`<div><b>${esc(x.date)}</b>${esc(x.label)} · ${n >= 0 ? n + ' days' : 'passed'}</div>`));
  });
  app.append(dl);

  const secC = $(`<div class="sec"><div class="sec-head"><h2>The criteria</h2>
    <p class="sub">Tap any evidence tag to update it — the scores recompute instantly. Words first: the grey line under each name is what the criterion actually asks.</p></div>
    <div class="grid cols2"></div></div>`);
  const grid = secC.querySelector('.grid');
  d.criteria.forEach(c => {
    const t = $(`<section class="tile">
      <div class="crit-head"><div><h2 style="font-size:17px">${esc(c.name)}</h2>
      <p class="sub">${esc(c.plain)}</p></div>
      <div class="score">${c.score}<small>%</small></div></div>
      <div style="margin-top:8px"><span class="chip ${chipClass(c.band)}">${esc(c.band)}</span>
      ${c.targeted ? '<span class="chip">Targeted in this filing</span>' : '<span class="chip">Second hurdle — always judged</span>'}</div>
      <div class="bar ${barClass(c.score)}"><div style="width:${c.score}%"></div></div>
      <p class="officer"><b>Officer's eye:</b> ${esc(c.officer_note)}</p>
      <p class="nextstep"><b>Next step:</b> ${esc(c.next_step)}</p>
      <details><summary>Evidence checklist (${c.evidence.filter(e=>e.status==='have').length} of ${c.evidence.length} in file)</summary>
      <div>${c.evidence.map((e,i)=>evRow(c.id, e, i)).join('')}</div></details>
    </section>`);
    grid.append(t);
  });
  app.append(secC);

  const ob = $(`<section class="tile sec"><h2>The reviewing officer's brief</h2>
    <p class="sub">${esc(d.officer_brief.as_of)}</p>
    <p style="font-size:14.5px; line-height:1.6; margin-top:10px">${esc(d.officer_brief.summary)}</p>
    <div style="margin-top:8px">${d.officer_brief.top_risks.map(r=>`<p class="risk">${esc(r)}</p>`).join('')}</div>
  </section>`);
  app.append(ob);

  // Benchmarks + pattern check
  if (d.benchmarks) {
    const bm = $(`<section class="tile sec"><h2>Benchmarks — how EB-1A cases are faring</h2>
      <p class="sub">${esc(d.benchmarks.intro)}</p>
      <div class="stats">${d.benchmarks.figures.map(f=>`<div class="stat"><b>${esc(f.value)}</b><span>${esc(f.label)}</span><span class="per">${esc(f.period)}</span></div>`).join('')}</div>
      <p class="sub" style="margin-top:12px">${esc(d.benchmarks.figures_note)}</p>
    </section>`);
    app.append(bm);
    const bp = $(`<section class="tile sec"><h2>Pattern check — our file vs. the denial playbook</h2>
      <p class="sub">The patterns officers and attorneys screen for, matched against your actual file.</p>
      <div style="margin-top:6px">${d.benchmarks.patterns.map(p=>`<div class="pat"><div style="flex:1"><b>${esc(p.pattern)}</b><div style="color:var(--sub); font-size:12.5px; line-height:1.5; margin-top:2px">${esc(p.note)}</div></div><span class="pill ${p.status_class}">${esc(p.status_label)}</span></div>`).join('')}</div>
      <p style="font-size:14px; line-height:1.6; margin-top:12px"><b>What this means for us:</b> ${esc(d.benchmarks.posture)}</p>
      <p class="sub" style="margin-top:8px">${esc(d.benchmarks.limits)}</p>
    </section>`);
    app.append(bp);
  }

  const order = {critical:0, high:1, medium:2, low:3};
  const tasks = [...d.tasks].sort((a,b)=> (a.status==='done')-(b.status==='done') || order[a.impact]-order[b.impact]);
  const secT = $(`<div class="sec"><div class="sec-head"><h2>Your step-by-step next steps</h2>
    <p class="sub">In impact order. Mark them done here — or just tell Buddy and he'll update the file.</p></div>
    <section class="tile"></section></div>`);
  const tBox = secT.querySelector('.tile');
  tasks.forEach(t => {
    const btn = {todo:'Start', in_progress:'In progress', done:'Done'}[t.status];
    tBox.append($(`<div class="task"><div style="flex:1">
      <span class="imp ${t.impact}">${esc(t.impact)}</span>
      <h3>${esc(t.title)}</h3><p class="det">${esc(t.detail)}</p>
      <p class="meta">Owner: ${esc(t.owner)}${t.due ? ' · Due ' + esc(t.due) : ''}</p></div>
      <button class="tbtn ${t.status}" data-task="${t.id}">${btn}</button></div>`));
  });
  app.append(secT);

  const secP = $(`<div class="sec"><div class="sec-head"><h2>Publications & citations</h2>
    <p class="sub">Citations checked ${esc(d.case.assessment_date)}. The existing four build citation evidence only — the new papers carry the criterion.</p></div>
    <div class="grid cols2">
      <section class="tile"><h2 style="font-size:16px">Existing papers</h2>
        ${d.papers_existing.map(p=>`<div class="paper"><span class="cites">${p.citations} citations</span>${esc(p.title)}<div class="vn">${esc(p.venue)}${p.doi ? ' · DOI ' + esc(p.doi) : ''} — ${esc(p.note)}</div></div>`).join('')}
      </section>
      <section class="tile"><h2 style="font-size:16px">New papers in the pipeline</h2>
        ${d.papers_pipeline.map(p=>`<div class="paper">${esc(p.title)}<div class="vn">${esc(p.venue)} · ${esc(p.status)}${p.deadline ? ' · due ' + esc(p.deadline) : ''}</div></div>`).join('')}
      </section>
    </div></div>`);
  app.append(secP);

  const secX = $(`<div class="sec"><div class="sec-head"><h2>Connected sources</h2>
    <p class="sub">Buddy refreshes these on each sync — Drive evidence, the Asana project, citation counts, GitHub metrics — and republishes this page.</p></div>
    <section class="tile">
      ${d.connections.map(c=>`<div class="conn"><b>${esc(c.name)}</b> — ${esc(c.status)}<div class="sub">${esc(c.detail)}</div></div>`).join('')}
    </section></div>`);
  app.append(secX);

  app.append($(`<p class="foot">This dashboard measures <b>evidence readiness</b> from your actual case file — it is not a prediction of any USCIS decision, and no tool can guarantee an approval or promise no RFE. What it does guarantee: nothing in the file is a surprise, every gap has a named next step, and the officer's likely objections are answered before the attorney ever sees the package.<br>Last assessment: ${esc(d.case.assessment_date)} · Firm: ${esc(d.case.firm)} · Patent counsel: ${esc(d.case.patent_counsel)}</p>`));

  app.querySelectorAll('[data-task]').forEach(b => b.onclick = () => {
    const cur = {Start:'in_progress', 'In progress':'done', Done:'todo'}[b.textContent];
    overrides.tasks[b.dataset.task] = cur; save(); load();
  });
  app.querySelectorAll('[data-ev]').forEach(b => b.onclick = () => {
    const key = b.dataset.ev;
    const cur = b.classList.contains('have') ? 'partial' : b.classList.contains('partial') ? 'missing' : 'have';
    overrides.evidence[key] = cur; save(); load();
  });
}
load();
</script>
</body>
